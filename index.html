<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section id="lojas" class="bg-[#EBD96B] flex md:flex-wrap md:justify-center items-center gap-4 px-2 md:px-4 *:w-13 md:*:w-20 *:mix-blend-darken">
            <img src="assets/images/h-m.png" alt="Logo H&M">
            <img src="assets/images/obey.png" alt="">
            <img class="" src="assets/images/shopify.jpg" alt="">
            <img class="" src="assets/images/lacoste.png" alt="">
            <img class="" src="assets/images/levis.jpg" alt="">
            <img class="md:w-20 md:h-16" src="assets/images/amazon.jpg" alt="">
    </section>

    <section id="youngs-favourite">
        <p class="text-4xl text-center font-black m-4">Young's Favourite</p>

        <div class="flex justify-center gap-4">
            <div class="flex flex-col items-center"> 
                <div class="w-44 h-80 overflow-hidden rounded-lg">
                    <img class="w-full h-full object-cover object-[35%_20%] rounded-2xl" src="assets/images/youngs-favourite-1.png" alt="Two white girls smiling wearing glasses" class="">
                </div>
                <a class="text-base" href="">Trending on Instagram</a>
                <h6>Explore Now!</h6>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-44 h-80 overflow-hidden rounded-lg">
                    <img class="w-full h-full object-cover object-[50%_20%] rounded-2xl" src="assets/images/youngs-favourite-2.png" alt="Girl with pink and red glasses smiling on a pink background">
                </div>
                <div class="flex gap-4 items-center ">
                    <div>
                        <a href="mt-2 text-center">All Under $40</a>
                        <h6>Explore Now!</h6>
                    </div>
                    <p class="text-[#797979]">→</p>
                </div>
            </div>
    </section>
</body>
</html>
